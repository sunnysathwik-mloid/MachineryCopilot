steps:
  # 1. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/machinery-copilot:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/machinery-copilot:latest', '.']

  # 2. Push container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/machinery-copilot:$COMMIT_SHA']

  # 3. Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'machinery-copilot'
      - '--image'
      - 'gcr.io/$PROJECT_ID/machinery-copilot:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/machinery-copilot:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/machinery-copilot:latest'
